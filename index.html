<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>주식팀 NEXUS · 대시보드</title>
<style>
:root{--bg:#070a12;--panel:#0e1422;--panel2:#121a2c;--line:#1f2a42;--text:#e6ecf7;--mute:#8592ad;--cyan:#38e1ff;--violet:#9b7bff;--green:#3ddc97;--amber:#ffb547;--red:#ff5d73;--pink:#ff6ad5}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR","Gothic A1","Nanum Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 10% -10%,#16204066,transparent),radial-gradient(900px 500px at 110% 10%,#2a184466,transparent),var(--bg)}
a{color:var(--cyan);text-decoration:none}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 22px;background:#070a12cc;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{width:30px;height:30px;border-radius:9px;background:conic-gradient(from 200deg,var(--cyan),var(--violet),var(--pink),var(--cyan));box-shadow:0 0 18px #38e1ff66;flex:none}
.brand b{font-size:16px;letter-spacing:.5px}.brand small{display:block;color:var(--mute);font-size:11px}
nav{margin-left:auto;display:flex;gap:6px}
nav button{background:var(--panel);color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}
nav button.on{color:#001018;background:linear-gradient(90deg,var(--cyan),var(--violet));border-color:transparent;font-weight:700}
main{max-width:1240px;margin:0 auto;padding:18px 22px 40px}
h2{font-size:15px;margin:26px 0 10px;color:#cdd6ea;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:6px;height:16px;border-radius:3px;background:linear-gradient(var(--cyan),var(--violet))}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(5,1fr)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:14px;position:relative;overflow:hidden;min-width:0}
.card .lb{font-size:12px;color:var(--mute)}
.card .v{font-size:22px;font-weight:800;margin-top:6px;letter-spacing:-.3px}
.card .s{font-size:11.5px;color:var(--mute);margin-top:4px;line-height:1.45}
.glow:after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--c,#38e1ff);filter:blur(40px);opacity:.25}
.pipe{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.step .n{font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);flex:none}
.dot.wait{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.dot.idle{background:#56607a;box-shadow:none}
.step .t{font-size:11.5px;color:var(--mute);margin-top:6px;line-height:1.45}
.arrow{display:flex;align-items:center;color:#3a4766;padding:0 6px;font-size:18px;flex:none}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
canvas.ch{width:100%;height:150px;display:block}
canvas.sp{width:100%;height:56px;display:block;margin-top:8px}
.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mute);margin-right:4px}
.tag.hold{color:var(--green);border-color:#3ddc9755}.tag.cand{color:var(--cyan);border-color:#38e1ff55}.tag.b8{color:var(--amber);border-color:#ffb54755}
.big{font-size:18px;font-weight:800;margin:6px 0 2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px;margin-top:8px}
.kv span:nth-child(odd){color:var(--mute)}
.empty{height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px dashed #2a3654;border-radius:10px;color:var(--mute);font-size:13px;gap:4px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:11.5px}
.tblwrap{overflow-x:auto}
.tl{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.ev{min-width:150px;flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;border-top:3px solid var(--c,#9b7bff)}
.ev b{font-size:13px}.ev div{font-size:11.5px;color:var(--mute);margin-top:4px;line-height:1.4}
.foot{color:var(--mute);font-size:11px;margin-top:28px;line-height:1.6}
/* graph */
#graphView{display:none;position:fixed;inset:57px 0 0 0;background:#02040a}
#g{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#g:active{cursor:grabbing}
.legend{position:absolute;left:14px;top:14px;background:#0b1120cc;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;backdrop-filter:blur(6px)}
.legend div{display:flex;align-items:center;gap:7px;margin:3px 0}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.ghint{position:absolute;right:14px;top:14px;color:var(--mute);font-size:11.5px;background:#0b1120cc;border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:right;line-height:1.5}
#info{position:absolute;right:14px;bottom:14px;width:330px;max-width:calc(100% - 28px);background:#0b1120ee;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:12.5px;line-height:1.55;display:none}
#info h3{margin:0 0 4px;font-size:15px}
#info .x{position:absolute;right:10px;top:8px;cursor:pointer;color:var(--mute);font-size:18px;background:none;border:0}
#tip{position:absolute;pointer-events:none;background:#0b1120ee;border:1px solid var(--line);padding:5px 9px;border-radius:8px;font-size:12px;display:none;white-space:nowrap}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
@media (max-width:560px){header{padding:10px 12px;gap:10px}.brand small{display:none}nav button{padding:6px 11px;font-size:12px}main{padding:12px 12px 30px}.kpis{grid-template-columns:1fr 1fr}.kpis .card:last-child{grid-column:span 2}.three{grid-template-columns:1fr}.card .v{font-size:19px}
 .step{min-width:132px;padding:10px}.arrow{padding:0 3px}
 #graphView{top:51px}.legend{font-size:10.5px;padding:6px 8px;display:grid;grid-template-columns:1fr 1fr;column-gap:10px;left:8px;top:8px}.legend div{margin:1px 0}.ghint{display:none}#info{left:14px;right:14px;width:auto}
 .hide-m{display:none}}
</style>
</head>
<body>
<header>
 <div class="logo"></div>
 <div class="brand"><b>주식팀 NEXUS</b><small id="hdrsub"></small></div>
 <nav><button id="tDash" class="on">대시보드</button><button id="tGraph">3D 지식 그래프</button></nav>
</header>

<main id="dashView">
 <div class="grid kpis" id="kpis"></div>

 <h2>작업 파이프라인</h2>
 <div class="pipe" id="pipe"></div>

 <h2>시장 지수 <span class="tag">종가 · Yahoo Finance (Chart 수집)</span></h2>
 <div class="grid two" id="idx"></div>

 <h2>보유 종목 <span class="tag">금액·수량은 표시 안 함</span></h2>
 <div class="grid three" id="hold"></div>

 <h2>8만원 단타 매매 계획 <span class="tag">Trade</span></h2>
 <div class="grid two" id="plans"></div>

 <h2>손익 추이 · 체결 기록</h2>
 <div class="grid two">
  <div class="card"><div class="lb">누적 손익 추이</div><div id="pnlBox"></div></div>
  <div class="card"><div class="lb">체결 내역</div><div id="fillBox"></div></div>
 </div>

 <h2>관심 종목 등락률 <span class="tag" id="retTag"></span></h2>
 <div class="card"><canvas class="ch" id="retChart" style="height:240px"></canvas></div>

 <h2>후보 종목 · 뉴스 <span class="tag">Find</span></h2>
 <div class="card tblwrap"><table id="cand"></table></div>

 <h2>다가오는 일정</h2>
 <div class="tl" id="tl"></div>

 <div class="foot" id="foot"></div>
</main>

<section id="graphView">
 <canvas id="g"></canvas>
 <div class="legend" id="legend"></div>
 <div class="ghint">드래그: 회전 · 휠/핀치: 확대<br>노드를 누르면 상세 정보</div>
 <div id="tip"></div>
 <div id="info"><button class="x" id="infoX">×</button><div id="infoBody"></div></div>
</section>

function pick(x,y){let best=null,bd=1e9;proj.forEach(p=>{const d=Math.hypot(p.x-x,p.y-y);if(d<Math.max(p.r+6,14)&&p.z<bd){bd=p.z;best=p.n;}});return best;}
const ptrs=new Map();let pinch=null,moved=0;
gc.addEventListener('pointerdown',e=>{gc.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.offsetX,e.offsetY]);moved=0;lastInteract=performance.now();if(ptrs.size===1)drag=[e.offsetX,e.offsetY];else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch=[Math.hypot(a[0]-b[0],a[1]-b[1]),zoom];drag=null;}});
gc.addEventListener('pointermove',e=>{const x=e.offsetX,y=e.offsetY;if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,[x,y]);lastInteract=performance.now();
 if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];zoom=Math.max(.4,Math.min(4,pinch[1]*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch[0]));moved+=5;return;}
 if(drag){const dx=x-drag[0],dy=y-drag[1];moved+=Math.abs(dx)+Math.abs(dy);rotY+=dx*.008;rotX=Math.max(-1.45,Math.min(1.45,rotX+dy*.008));drag=[x,y];$('#tip').style.display='none';return;}
 if(e.pointerType==='mouse'){hover=pick(x,y);const tp=$('#tip');if(hover){tp.style.display='block';tp.textContent=CAT[hover.cat][1]+' · '+hover.label;tp.style.left=(x+14)+'px';tp.style.top=(y+10)+'px';gc.style.cursor='pointer';}else{tp.style.display='none';gc.style.cursor='';}}});
function up(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(ptrs.size===0){if(moved<6){const n=pick(e.offsetX,e.offsetY);showInfo(n);}drag=null;}}
gc.addEventListener('pointerup',up);gc.addEventListener('pointercancel',up);
gc.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.4,Math.min(4,zoom*Math.exp(-e.deltaY*.0012)));lastInteract=performance.now();},{passive:false});
function showInfo(n){sel=n;const b=$('#info');if(!n){b.style.display='none';return;}const c=CAT[n.cat];
 const nb=[...neigh(n)].filter(x=>x!==n).map(x=>`<span class="tag" style="color:${CAT[x.cat][0]}">${esc(x.label)}</span>`).join(' ');
 $('#infoBody').innerHTML=`<div style="color:${c[0]};font-size:11px">${c[1]}</div><h3>${esc(n.label)}</h3>${n.info}<div style="margin-top:6px">${nb}</div>`;b.style.display='block';}
$('#infoX').onclick=()=>showInfo(null);

/* ---------- tabs ---------- */
function show(v){const g=v==='graph';$('#dashView').style.display=g?'none':'block';$('#graphView').style.display=g?'block':'none';$('#tDash').classList.toggle('on',!g);$('#tGraph').classList.toggle('on',g);if(g)gsize();else drawAll();history.replaceState(null,'',g?'#graph':'#dash');}
$('#tDash').onclick=()=>show('dash');$('#tGraph').onclick=()=>show('graph');
window.addEventListener('resize',()=>{if($('#graphView').style.display==='block')gsize();else drawAll();});
show(location.hash==='#graph'?'graph':'dash');requestAnimationFrame(frame);
</script>
